<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0d6b73"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-title" content="Habits"><meta name="apple-mobile-web-app-status-bar-style" content="default"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Meine Habits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one phone column; date + streak header, 14-day strip, today's ring, habit list with 7-day trail, edit mode */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#15202b; --muted:#5b6876; --line:#d7dde4;
  --accent:#0d6b73; --accent-ink:#ffffff; --accent-soft:#d6ecee;
  --good:#2f8a4c; --warn:#b7791f; --warn-soft:#f6ead2; --bad:#c2413b; --bad-soft:#f6dcda;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10161c; --surface:#18212a; --ink:#e6ecf1; --muted:#97a4b1; --line:#2a3642;
  --accent:#4fb8c1; --accent-ink:#0b1a1d; --accent-soft:#183a3e;
  --good:#5cc27d; --warn:#e2a948; --warn-soft:#3a2e17; --bad:#ec6e66; --bad-soft:#3d1f1e;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10161c; --surface:#18212a; --ink:#e6ecf1; --muted:#97a4b1; --line:#2a3642;
  --accent:#4fb8c1; --accent-ink:#0b1a1d; --accent-soft:#183a3e;
  --good:#5cc27d; --warn:#e2a948; --warn-soft:#3a2e17; --bad:#ec6e66; --bad-soft:#3d1f1e;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;padding:16px;padding-block:14px 40px}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--display);font-weight:700;margin:0;letter-spacing:.01em}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.datenav{display:flex;align-items:center;gap:6px;min-width:0}
.datenav h1{font-size:26px;line-height:1.05;white-space:nowrap}
.datenav .sub{font-size:13px;color:var(--muted)}
.arrow{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px;flex:none}
.arrow:disabled{opacity:.35;cursor:default}
.streak{flex:none;text-align:center;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:6px 12px 7px;min-width:72px}
.streak b{display:block;font-family:var(--display);font-size:30px;line-height:1}
.streak span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}

.strip{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.dot{aspect-ratio:1;max-width:100%;border-radius:6px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:10px;color:var(--muted);padding:0}
.dot.part{background:var(--warn-soft);border-color:var(--warn)}
.dot.ok{background:var(--good);border-color:var(--good);color:var(--surface)}
.dot.sel{outline:2px solid var(--ink);outline-offset:1px}
.striplbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 14px}
.cardhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0 4px}
.progress{display:flex;align-items:center;gap:10px;flex:1}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--line);white-space:nowrap}
.pill.ok{background:var(--good);color:var(--surface)}
.textbtn{border:0;background:none;color:var(--accent);font-weight:600;font-size:14px;padding:4px 0}

.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.box{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;transition:background .15s,border-color .15s}
.box svg{width:16px;height:16px;opacity:0}
.item.on .box{background:var(--accent);border-color:var(--accent)}
.item.on .box svg{opacity:1}
.item .t{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.item .t b{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.item.on .t b{color:var(--muted)}
.trail{display:flex;gap:3px;align-items:center}
.trail i{width:9px;height:9px;border-radius:3px;background:var(--line)}
.trail i.d{background:var(--good)}
.trail i.v{outline:1.5px solid var(--ink);outline-offset:1px}
.hs{flex:none;text-align:right;font-size:12px;color:var(--muted);line-height:1.1}
.hs b{display:block;font-family:var(--display);font-size:22px;color:var(--ink)}
.empty{color:var(--muted);padding:14px 0;font-size:15px}

.erow{display:flex;gap:6px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.erow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;font-size:16px}
.ib{flex:none;width:36px;height:36px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-size:16px;display:grid;place-items:center}
.ib:disabled{opacity:.3}
.ib.del{color:var(--bad)}
.ib.armed{background:var(--bad);color:var(--surface);border-color:var(--bad);width:auto;padding:0 10px;font-size:13px;font-weight:600}
.addrow{display:flex;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.addrow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;font-size:16px}
.addrow button{border:0;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:0 14px;font-weight:600}

.reset{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:7px 16px;font-size:14px;font-weight:600}
.reset.armed{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
footer{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
footer a,footer label{color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head><body>
<div class="wrap">
  <header>
    <div class="datenav">
      <button class="arrow" id="prev" aria-label="Vorheriger Tag">‹</button>
      <div><h1 id="dTitle">Heute</h1><div class="sub num" id="dSub"></div></div>
      <button class="arrow" id="next" aria-label="Nächster Tag">›</button>
    </div>
    <div class="streak" title="Tage am Stück, an denen alles abgehakt war"><b class="num" id="streak">0</b><span>Tage komplett</span></div>
  </header>

  <section>
    <div class="strip" id="strip"></div>
    <div class="striplbl"><span>letzte 14 Tage</span><span>grün = alles erledigt</span></div>
  </section>

  <section class="card">
    <div class="cardhead">
      <div class="progress"><div class="bar"><i id="bar"></i></div><span class="pill num" id="pill">0/0</span></div>
      <button class="textbtn" id="editBtn">Bearbeiten</button>
    </div>
    <div id="list"></div>
  </section>

  <section style="display:flex;justify-content:center" id="resetWrap" hidden>
    <button class="reset" id="reset">Tag zurücksetzen</button>
  </section>

  <footer><span id="sync">Lädt …</span><span style="display:flex;gap:14px;flex-wrap:wrap"><a href="#" id="exp">Backup sichern</a><label for="imp" style="color:var(--accent);cursor:pointer;text-decoration:underline">Backup laden</label><input type="file" id="imp" accept="application/json,.json" hidden></span><span id="links" style="display:flex;gap:14px;flex-wrap:wrap"></span></footer>
</div>

<script>
(function(){
const CHECK='<svg viewBox="0 0 16 16" fill="none" stroke="var(--accent-ink)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';
const DEFAULT_HABITS=['Cronometer eingetragen','210 g Protein','Kreatin','Training oder Bewegung','WHOOP Recovery gecheckt','Supplements','Morgens gewogen'];

let habits=[];        // [{id,name}]
let log={};           // date -> {done:{id:true}}
let view=todayISO();
let editing=false;
let store=null, ready=false;

function todayISO(){return iso(new Date())}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parse(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function add(s,n){const d=parse(s);d.setDate(d.getDate()+n);return iso(d)}
function diff(a,b){return Math.round((parse(a)-parse(b))/864e5)}
function fmt(s,o){return parse(s).toLocaleDateString('de-DE',o)}
function uid(){return 'h'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
const isDone=(date,id)=>!!(log[date]&&log[date].done&&log[date].done[id]);
const doneCount=date=>habits.filter(h=>isDone(date,h.id)).length;
function dayState(date){const n=doneCount(date);if(!habits.length||n===0)return '';return n===habits.length?'ok':'part'}
function habitStreak(id){let cur=isDone(todayISO(),id)?todayISO():add(todayISO(),-1),s=0;while(isDone(cur,id)){s++;cur=add(cur,-1)}return s}
function dayStreak(){const t=todayISO();let cur=dayState(t)==='ok'?t:add(t,-1),s=0;while(dayState(cur)==='ok'){s++;cur=add(cur,-1)}return s}

// ---- persistence ----
const pending={};let timer=null;
function queueDay(date){pending[date]=log[date]||null;clearTimeout(timer);timer=setTimeout(flush,300)}
async function flush(){
  const batch=Object.assign({},pending);for(const k in pending)delete pending[k];
  if(store){for(const k in batch){try{if(batch[k]===null)await store.doc('log/'+k).delete();else await store.doc('log/'+k).set(batch[k])}catch(e){setSync('Speichern fehlgeschlagen, bitte nochmal tippen',true)}}}
  else{try{localStorage.setItem('habit-log',JSON.stringify(log))}catch(e){}}
}
async function saveHabits(){
  if(store){try{await store.doc('habits/liste').set({items:habits})}catch(e){setSync('Speichern fehlgeschlagen',true)}}
  else{try{localStorage.setItem('habit-list',JSON.stringify(habits))}catch(e){}}
}
function setSync(t,bad){const el=document.getElementById('sync');el.textContent=t;el.style.color=bad?'var(--bad)':''}

function toggle(id){
  const d=log[view]?JSON.parse(JSON.stringify(log[view])):{done:{}};
  d.done=d.done||{};
  if(d.done[id])delete d.done[id];else d.done[id]=true;
  if(Object.keys(d.done).length){log[view]=d}else{delete log[view]}
  queueDay(view);render();
}

// ---- render ----
const $=id=>document.getElementById(id);
function render(){
  const t=todayISO(),rel=diff(view,t);
  $('dTitle').textContent=rel===0?'Heute':rel===-1?'Gestern':rel===1?'Morgen':fmt(view,{weekday:'long'});
  $('dSub').textContent=fmt(view,{weekday:'short',day:'numeric',month:'long'});
  $('next').disabled=rel>=1;
  $('streak').textContent=dayStreak();

  const strip=$('strip');strip.innerHTML='';
  for(let i=13;i>=0;i--){
    const k=add(t,-i),st=dayState(k),b=document.createElement('button');
    b.className='dot num'+(st?' '+st:'')+(k===view?' sel':'');
    b.textContent=parse(k).getDate();
    b.setAttribute('aria-label',fmt(k,{weekday:'long',day:'numeric',month:'long'})+(st==='ok'?', alles erledigt':st==='part'?', teilweise':''));
    b.onclick=()=>{view=k;render()};strip.appendChild(b);
  }

  const n=doneCount(view),total=habits.length;
  $('pill').textContent=total&&n===total?'Alles erledigt':n+'/'+total;
  $('pill').className='pill num'+(total&&n===total?' ok':'');
  $('bar').style.width=(total?n/total*100:0)+'%';
  $('editBtn').textContent=editing?'Fertig':'Bearbeiten';
  $('resetWrap').hidden=editing||!log[view];

  const list=$('list');list.innerHTML='';
  if(editing){renderEdit(list);return}
  if(!habits.length){list.innerHTML='<p class="empty">Noch keine Habits. Tippe auf „Bearbeiten“ und leg deinen ersten an.</p>';return}
  habits.forEach(h=>{
    const on=isDone(view,h.id);
    const b=document.createElement('button');b.className='item'+(on?' on':'');b.setAttribute('aria-pressed',on);
    let trail='';for(let i=6;i>=0;i--){const k=add(view,-i);trail+='<i class="'+(isDone(k,h.id)?'d':'')+(i===0?' v':'')+'" title="'+fmt(k,{weekday:'short',day:'numeric'})+'"></i>'}
    const s=habitStreak(h.id);
    b.innerHTML='<span class="box">'+CHECK+'</span><span class="t"><b></b><span class="trail" aria-hidden="true">'+trail+'</span></span><span class="hs"><b class="num">'+s+'</b>'+(s===1?'Tag':'Tage')+'</span>';
    b.querySelector('b').textContent=h.name;
    b.onclick=()=>toggle(h.id);list.appendChild(b);
  });
}
function renderEdit(list){
  habits.forEach((h,i)=>{
    const row=document.createElement('div');row.className='erow';
    const inp=document.createElement('input');inp.value=h.name;inp.id='h-'+h.id;inp.setAttribute('aria-label','Name');
    inp.onchange=()=>{const v=inp.value.trim();if(v){h.name=v;saveHabits()}else inp.value=h.name};
    const up=btn('↑','Nach oben',()=>{[habits[i-1],habits[i]]=[habits[i],habits[i-1]];saveHabits();render()});up.disabled=i===0;
    const dn=btn('↓','Nach unten',()=>{[habits[i+1],habits[i]]=[habits[i],habits[i+1]];saveHabits();render()});dn.disabled=i===habits.length-1;
    const del=btn('✕','Löschen',()=>{
      if(!del.classList.contains('armed')){del.classList.add('armed');del.textContent='Löschen?';setTimeout(()=>{if(del.isConnected){del.classList.remove('armed');del.textContent='✕'}},3500);return}
      habits.splice(i,1);saveHabits();render();
    });del.classList.add('del');
    row.append(inp,up,dn,del);list.appendChild(row);
  });
  const a=document.createElement('form');a.className='addrow';
  a.innerHTML='<input id="newHabit" placeholder="Neuer Habit, z. B. 3 Liter Wasser" autocomplete="off"><button type="submit">Hinzufügen</button>';
  a.onsubmit=e=>{e.preventDefault();const v=a.querySelector('input').value.trim();if(!v)return;habits.push({id:uid(),name:v});saveHabits();render();const ni=$('newHabit');if(ni)ni.focus()};
  list.appendChild(a);
}
function btn(txt,label,fn){const b=document.createElement('button');b.className='ib';b.textContent=txt;b.setAttribute('aria-label',label);b.onclick=fn;return b}

let armT=null;
$('reset').onclick=()=>{
  const b=$('reset');
  if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='Wirklich alle Haken für diesen Tag löschen?';clearTimeout(armT);armT=setTimeout(()=>{b.classList.remove('armed');b.textContent='Tag zurücksetzen'},4000);return}
  clearTimeout(armT);b.classList.remove('armed');b.textContent='Tag zurücksetzen';
  delete log[view];queueDay(view);render();
};
$('editBtn').onclick=()=>{editing=!editing;render()};
$('prev').onclick=()=>{view=add(view,-1);render()};
$('next').onclick=()=>{if(diff(view,todayISO())<1){view=add(view,1);render()}};
$('links').innerHTML='<a href="https://claude.ai/code/artifact/cb193bb7-6c48-46bd-8aa6-5a9e7c2ebd5f" target="_blank" rel="noopener">Fahrplan</a>';

// ---- boot ----
render();
(async function(){
  let db=null;
  try{db=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){db=null}
  if(!db){
    try{
      const l=localStorage.getItem('habit-list');habits=l?JSON.parse(l):DEFAULT_HABITS.map(n=>({id:uid(),name:n}));
      if(!l)localStorage.setItem('habit-list',JSON.stringify(habits));
      log=JSON.parse(localStorage.getItem('habit-log')||'{}')||{};
    }catch(e){habits=DEFAULT_HABITS.map(n=>({id:uid(),name:n}))}
    setSync('Gespeichert auf diesem iPhone');render();return;
  }
  store=db;
  db.doc('habits/liste').onSnapshot(s=>{
    if(s.exists){habits=JSON.parse(JSON.stringify((s.data().items)||[]))}
    else if(!ready&&!s.metadata.fromCache){habits=DEFAULT_HABITS.map(n=>({id:uid(),name:n}));saveHabits()}
    ready=true;if(!editing)render();
  },()=>setSync('Verbindung verloren, bitte Seite neu laden',true));
  db.collection('log').onSnapshot(snap=>{
    const next={};snap.docs.forEach(doc=>{if(doc.exists)next[doc.id]=JSON.parse(JSON.stringify(doc.data()))});
    for(const k in pending){if(pending[k]===null)delete next[k];else next[k]=pending[k]}
    log=next;setSync('Gespeichert, auf allen Geräten gleich');if(!editing)render();
  },()=>setSync('Verbindung verloren, bitte Seite neu laden',true));
})();
})();
</script>

<script>
document.getElementById('exp').onclick=async e=>{e.preventDefault();
  const data=JSON.stringify({log:JSON.parse(localStorage.getItem('habit-log')||'{}'),habits:JSON.parse(localStorage.getItem('habit-list')||'[]')},null,1);
  const name='habits-backup-'+new Date().toISOString().slice(0,10)+'.json';
  const file=new File([data],name,{type:'application/json'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}}catch(err){if(err.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;a.click();};
document.getElementById('imp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.log||!j.habits)throw 0;localStorage.setItem('habit-log',JSON.stringify(j.log));localStorage.setItem('habit-list',JSON.stringify(j.habits));location.reload()}catch(err){document.getElementById('sync').textContent='Diese Datei ist kein Habit-Backup'}};r.readAsText(f)};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body></html>
